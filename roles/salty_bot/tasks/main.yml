---
# salty_bot: main.yml
# State-driven lifecycle for salty-bot

- name: Validate salty_bot_state parameter
  ansible.builtin.fail:
    msg: "salty_bot_state must be one of: prepare, present, absent (got: {{ salty_bot_state }})"
  when: salty_bot_state not in ['prepare', 'present', 'absent']

- name: Validate required configuration
  ansible.builtin.assert:
    that:
      - domain != "REQUIRED"
      - matrix_homeserver_url != "REQUIRED"
      - salty_bot_room != "REQUIRED"
    fail_msg: |
      Missing required configuration. Create inventory/group_vars/all.yml with:
        domain: "your-domain.com"
        matrix_homeserver_url: "https://matrix.your-domain.com"
        salty_bot_room_default: "#SecondBrain:your-domain.com"
    success_msg: "Configuration validated for domain: {{ domain }}"
  when: salty_bot_state in ['prepare', 'present']

- name: Display salty_bot configuration
  ansible.builtin.debug:
    msg:
      - "=== Salty Bot Configuration ==="
      - "State:           {{ salty_bot_state }}"
      - "Domain:          {{ domain }}"
      - "Homeserver:      {{ matrix_homeserver_url }}"
      - "Room:            {{ salty_bot_room }}"
      - "MongoDB DB:      {{ brain2_mongodb_db }}"
      - "S3 endpoint:     {{ s3_endpoint_url }}"
      - "S3 bucket:       {{ s3_bucket }}"
      - "Autosave (min):  {{ salty_autosave_minutes }}"
  when: salty_bot_state in ['prepare', 'present']

- name: Prepare salty-bot environment
  when: salty_bot_state == 'prepare'
  ansible.builtin.include_role:
    name: _bot_base
    tasks_from: prepare.yml

- name: Deploy salty-bot
  when: salty_bot_state == 'present'
  ansible.builtin.include_role:
    name: _bot_base
    tasks_from: present.yml

- name: Remove salty-bot
  when: salty_bot_state == 'absent'
  ansible.builtin.include_role:
    name: _bot_base
    tasks_from: cleanup.yml
