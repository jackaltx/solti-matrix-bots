---
# card_capture_bot role defaults
# Business card OCR via Matrix — S3 storage + inbox review flow

domain: "{{ lookup('env', 'MATRIX_DOMAIN') | default(domain_required | default('REQUIRED'), true) }}"
matrix_homeserver_url: "{{ lookup('env', 'MATRIX_HOMESERVER_URL') | default(matrix_homeserver_url_required | default('REQUIRED'), true) }}"
card_capture_bot_room: "{{ lookup('env', 'CARD_CAPTURE_BOT_ROOM') | default(card_capture_bot_room_default | default('REQUIRED'), true) }}"

matrix_working_dir: "{{ lookup('env', 'MATRIX_WORKING_DIR') | default(matrix_working_dir_default | default(real_user_dir), true) }}"

brain2_mongodb_uri: "{{ lookup('env', 'BRAIN2_MONGODB_URI') | default('mongodb://localhost:27017', true) }}"
brain2_mongodb_db: "{{ lookup('env', 'BRAIN2_MONGODB_DB') | default('second_brain', true) }}"

s3_endpoint_url: "{{ lookup('env', 'S3_ENDPOINT_URL') | default('http://localhost:9000', true) }}"
s3_bucket: "{{ lookup('env', 'S3_BUCKET') | default('card-captures', true) }}"

bot_properties:
  root: "card-capture-bot"
  name: "card-capture-bot.service"
  script_name: "card-capture-bot.py"
  pre_start_check: "for i in $(seq 30); do bash -c 'echo > /dev/tcp/127.0.0.1/27017' >/dev/null 2>&1 && exit 0; sleep 2; done; exit 1"

  data_dir: "{{ real_user_dir }}/matrix-bots"
  bot_dir:  "{{ real_user_dir }}/matrix-bots/card-capture-bot"
  venv_dir: "{{ real_user_dir }}/matrix-bots/venv"

  working_dir: "{{ matrix_working_dir }}"

  delete_data: "{{ lookup('env', 'DELETE_DATA') | default(false) | bool }}"

  requirements:
    - "matrix-nio>=0.25.2"
    - "anthropic>=0.96.0"
    - "pymongo>=4.0"
    - "boto3>=1.34"

  environment:
    MATRIX_HOMESERVER_URL: "{{ matrix_homeserver_url }}"
    MATRIX_ROOM_ID:        "{{ card_capture_bot_room }}"
    MATRIX_BOT_USER_ID:    "@card-capture:{{ domain }}"
    BRAIN2_MONGODB_URI:    "{{ brain2_mongodb_uri }}"
    BRAIN2_MONGODB_DB:     "{{ brain2_mongodb_db }}"
    MATRIX_ALLOWED_USERS:  "{{ matrix_allowed_users | default('') }}"
    S3_ENDPOINT_URL:       "{{ s3_endpoint_url }}"
    S3_BUCKET:             "{{ s3_bucket }}"

  secrets:
    - MATRIX_CARD_CAPTURE_TOKEN
    - ANTHROPIC_API_KEY
    - S3_ACCESS_KEY
    - S3_SECRET_KEY

  restart_policy: "on-failure"
  restart_sec: 30

card_capture_bot_state: "prepare"
