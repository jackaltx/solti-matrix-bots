---
# matrix_watcher role defaults
# Event validation bot for Matrix rooms

# Domain configuration (from group_vars or fail)
# Users must create inventory/group_vars/all.yml with these values
domain: "{{ lookup('env', 'MATRIX_DOMAIN') | default(domain_required | default('REQUIRED')) }}"
matrix_homeserver_url: "{{ lookup('env', 'MATRIX_HOMESERVER_URL') | default(matrix_homeserver_url_required | default('REQUIRED')) }}"
matrix_watcher_room: "{{ lookup('env', 'MATRIX_WATCHER_ROOM') | default(matrix_watcher_room_default | default('REQUIRED')) }}"

# Working directory (where bot scripts execute from)
matrix_working_dir: "{{ lookup('env', 'MATRIX_WORKING_DIR') | default(matrix_working_dir_default | default(real_user_dir)) }}"

# Bot properties for matrix_watcher
bot_properties:
  root: "matrix-watcher"
  name: "matrix-watcher.service"
  script_name: "matrix-bot-nio.py"

  # Directory structure
  data_dir: "{{ real_user_dir }}/matrix-bots"
  bot_dir: "{{ real_user_dir }}/matrix-bots/matrix-watcher"
  venv_dir: "{{ real_user_dir }}/matrix-bots/venv"  # Shared venv

  # Working directory - externalized
  working_dir: "{{ matrix_working_dir }}"

  # Data deletion flag
  delete_data: "{{ lookup('env', 'DELETE_DATA') | default(false) | bool }}"

  # Python dependencies
  requirements:
    - "matrix-nio>=0.25.2"

  # Environment variables - all externalized via env or group_vars
  environment:
    MATRIX_HOMESERVER_URL: "{{ matrix_homeserver_url }}"
    MATRIX_ROOM_ID: "{{ matrix_watcher_room }}"
    MATRIX_BOT_USER_ID: "@matrix-watcher:{{ domain }}"

  # Secrets needed (from ~/.secrets/LabMatrix)
  secrets:
    - MATRIX_WATCHER_TOKEN

  # Systemd configuration
  restart_policy: "on-failure"
  restart_sec: 10

# State variable (set by manage-bot.sh)
matrix_watcher_state: "prepare"
