---
# Bot services inventory for solti-matrix-bots collection
# Used by manage-bot.sh
#
# Pattern mirrors solti-containers: named host registry + capability groups
# - Top level 'mylab' group = central host registry
# - Children groups = bot capability groups ({bot}_svc)
# - Default host: firefly (localhost) — override with -h for remote deployment

all:
  children:
    mylab:
      hosts:
        firefly:
          ansible_host: "localhost"
          ansible_connection: local
          ansible_user: "{{ lookup('env', 'USER') }}"

      children:
        # matrix-watcher bot deployment group
        matrix_watcher_svc:
          hosts:
            firefly:

        # claude-code-bot deployment group
        claude_code_bot_svc:
          hosts:
            firefly:

        # brain2-bot deployment group
        brain2_bot_svc:
          hosts:
            firefly:

        # card-capture-bot deployment group
        card_capture_bot_svc:
          hosts:
            firefly:

        # salty-bot deployment group
        salty_bot_svc:
          hosts:
            firefly:
